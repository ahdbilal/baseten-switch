name: Bug report
description: Report a reproducible Unity Gateway problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, authorization headers, request bodies, or other secrets.
        Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or configuration that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Unity Gateway version
      placeholder: unity-gateway v0.2.0
    validations:
      required: true
  - type: input
    id: databricks_cli_version
    attributes:
      label: Databricks CLI version
      placeholder: databricks v0.3.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15.5, arm64
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant doctor output or logs only after removing credentials, request content, personal information, and internal hostnames.
