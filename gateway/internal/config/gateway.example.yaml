# gateway.yaml -- Unity Gateway gateway config ('unity-gateway config init' writes exactly this file).
# Field reference: config/schema.md.
# Topology: harness -> door 127.0.0.1:45271 -> router 127.0.0.1:45272.
# ${VAR} resolves from the environment, then ~/.config/unity-gateway/env (mode 0600); no secrets live here.

global:
  # One global switch. Off pauses workspace routing; On applies saved routing policy.
  routing_enabled: true

  # Independent status classes that may transition a Databricks attempt to the native provider.
  fallback_policy:
    on_databricks_429: true
    on_databricks_5xx: true

  # The selected workspace profile supplies OAuth. Legacy auth fields are unused.
  # databricks below is only the explicit environment fallback; see schema.md.
  auth:
    databricks:   ${DATABRICKS_API_KEY}
    anthropic: ${ANTHROPIC_API_KEY}

  # Private segmented JSONL request store; the dashboards read it.
  telemetry_dir: ~/.config/unity-gateway/telemetry
  telemetry_enabled: true
  telemetry_retention_days: 90

  # High-sensitivity request/response capture is disabled by default. When
  # enabled, exact bodies can contain prompts, reasoning, tool data, source
  # code, credentials, personal data, and regulated data. See schema.md.
  # trace_capture:
  #   enabled: true
  #   clients:
  #     - claude-code
  #   retention_days: 7

  # Retry and timeout knobs shared by all harnesses.
  retry_max: 3
  request_timeout: 600s
  # Per-attempt first-byte deadline; expiry falls through to fallback_route. 0/absent = disabled.
  # ttft_timeout: 30s

clients:
  # One entry per harness; entries share one router listener (dispatch by path).

  - name: claude-code
    enabled: true
    bind_addr: 127.0.0.1:45272
    protocol_shape: anthropic
    # What the harness sends to the gateway (collected, not yet enforced).
    auth_token:
      header: Authorization
      value: ${ANTHROPIC_AUTH_TOKEN}
    # Databricks target for requests without an explicit family route.
    default_model: system.ai.glm-5-3
    # Every Claude family defaults to GLM-5.2 and remains editable while the global switch is Off.
    model_routes:
      fable:  system.ai.glm-5-3
      opus:   system.ai.glm-5-3
      sonnet: system.ai.glm-5-3
      haiku:  system.ai.glm-5-3
    # Picker-visible Databricks models for Claude Code; see the model-discovery contract.
    model_aliases:
      claude-databricks-glm-5-2:   system.ai.glm-5-3
      claude-databricks-kimi-k2-7: system.ai.kimi-k3
      claude-databricks-nemotron:  system.ai.gpt-6-1-sol
    # Ordered Databricks rows appended to Claude Code's native /model choices.
    model_picker:
      enabled: true
      models:
        - alias: claude-databricks-glm-5-2
        - alias: claude-databricks-kimi-k2-7
        - alias: claude-databricks-nemotron
    # Route Claude Code subagent (sidechain) traffic to a model; toggle with 'unity-gateway claude subagents'. See the subagent-routing contract.
    # subagent_model: claude-databricks-glm-5-2
    # subagent_routing: on
    # Native provider used after an eligible Databricks attempt fails.
    fallback_route: anthropic
    # Used only when a Claude request starts with a Databricks alias or raw slug.
    # Native-origin requests retain the exact model Claude requested.
    native_fallback_model: claude-opus-5

  # codex ships parked (enabled: false; no listener bound); 'unity-gateway codex on' offers to
  # enable it, or set enabled: true and SIGHUP the router yourself.
  - name: codex
    enabled: false
    bind_addr: 127.0.0.1:45272
    protocol_shape: openai
    auth_token:
      header: Authorization
      value: ${CODEX_AUTH_TOKEN}
    default_model: system.ai.glm-5-3
    # Responses request normalization and stream consistency safeguards.
    # The additional_tools rewrite is experimental and must be opted into.
    responses_compatibility:
      text_format_default: on
      additional_tools_input: off
      reasoning_effort: on
      function_arguments_consistency: on
    # Emergency only. Empty means no tool types are removed.
    responses_strip_tool_types: []
    fallback_route: openai

# Front-door ports: harnesses point at bind_addr; forwards to router_addr, serves the native provider when tripped.
door:
  cooldown: 15s
  probe_interval: 3s
  ports:
    - bind_addr: 127.0.0.1:45271
      router_addr: 127.0.0.1:45272

# Additional door ports may target separate router listeners when needed.
